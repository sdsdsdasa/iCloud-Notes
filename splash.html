<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iCloud Notes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      height: 300px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 360px;
      height: 260px;
      border-radius: 20px;
      background: linear-gradient(145deg, #1c1c1e, #2c2c2e);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(145deg, #FFD60A, #FF9F0A);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255,214,10,0.35);
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    h1 {
      color: #f5f5f7;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: #8e8e93;
      font-size: 13px;
      margin-top: -10px;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFD60A;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Notes icon (pencil/notepad) -->
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="4" width="22" height="28" rx="3" ry="3" fill="white" opacity="0.9"/>
        <rect x="10" y="10" width="14" height="2" rx="1" fill="#FF9F0A"/>
        <rect x="10" y="15" width="14" height="2" rx="1" fill="#FF9F0A"/>
        <rect x="10" y="20" width="9" height="2" rx="1" fill="#FF9F0A"/>
        <path d="M28 22 L34 28 L30 32 L24 26 Z" fill="white" opacity="0.9"/>
        <path d="M30 32 L28 35 L26 34 L24 32 Z" fill="white" opacity="0.6"/>
      </svg>
    </div>
    <h1>iCloud Notes</h1>
    <p class="subtitle">Loading your notes...</p>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
